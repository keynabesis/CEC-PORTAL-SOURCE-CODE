<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Grades | Cebu Eastern College</title>
    <link rel="stylesheet" href="portal.css" />
    <script src="portal.js" defer></script>
  <link rel="stylesheet" href="fullscreen.css">
</head>
  <body data-page="grades">
    <main class="portal-frame">
      <p class="frame-label">GRADES</p>
      <div class="portal-layout">
        <aside id="sidebar" class="portal-sidebar"></aside>
        <section class="portal-main">
          <div id="page-content"><p role="status">Loading…</p></div>
          <p
            class="page-status"
            id="page-status"
            role="status"
            aria-live="polite"
          ></p>
        </section>
      </div>
    </main>
    <dialog id="portal-dialog" aria-labelledby="dialog-title">
      <button id="dialog-close" aria-label="Close">×</button>
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
    </dialog>
  </body>
</html>
